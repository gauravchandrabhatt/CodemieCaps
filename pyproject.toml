[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codemie-caps"
version = "0.1.0"
description = "A lightweight AI-assisted SDLC workflow cockpit with SQLite persistence and human approvals."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1.0",
  "playwright>=1.47,<2.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
